<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The link token sits in the URL: no page ever sends it to another site. -->
    <meta name="referrer" content="no-referrer" />
    <!-- The app installed on an iPhone draws under the status bar, as the header band then reaches the top: otherwise iOS paints that bar with
         the page's background, a strip apart from the band. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f3d9a4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#33291c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>La Pince</title>
    <script>
      // The theme before the first paint, as `src/screens/theme.ts` then keeps it: no light frame in the dark theme.
      var theme;
      try {
        theme = localStorage.getItem('la-pince:theme');
      } catch {}
      document.documentElement.dataset.theme =
        theme === 'light' || theme === 'dark' ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Safety net: replays the check lefthook runs before every push. The `verifier` job is required by the branch rule on main.
# On main, then deploys the instance whose secrets are set in the repo (docs/auto-hebergement.md, decision 43).
name: Vérifier

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run on main is never cut short: its deployment may be applying migrations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifier:
    name: verifier
    runs-on: ubuntu-latest
    # Usually under 3 min; the system libraries of the browsers come from Ubuntu's mirror, which took 8 min once.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verifier
      # End to end (decision 35 f): the app built with its service worker, in Chromium and WebKit, against the Worker on a local D1.
      - run: pnpm --filter @la-pince/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm e2e

  deployer:
    name: deployer
    needs: verifier
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in this environment, which only main may deploy to; without them the job does nothing, so a fork is not affected.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_PRODUCTION_JSONC: ${{ secrets.WRANGLER_PRODUCTION_JSONC }}
    steps:
      - id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$WRANGLER_PRODUCTION_JSONC" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No deployment: the secrets of the production environment are not set."
          fi
      - if: steps.secrets.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.set == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.secrets.outputs.set == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.secrets.outputs.set == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.set == 'true'
        run: printf '%s' "$WRANGLER_PRODUCTION_JSONC" > apps/server/wrangler.production.jsonc
      - if: steps.secrets.outputs.set == 'true'
        run: pnpm --filter @la-pince/server run deploy

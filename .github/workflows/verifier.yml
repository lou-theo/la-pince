# Safety net: replays the check lefthook runs before every push. The `verifier` job is required by the branch rule on main.
name: Vérifier

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verifier
      # End to end (decision 35 f): the app built with its service worker, in Chromium and WebKit, against the Worker on a local D1.
      - run: pnpm --filter @la-pince/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm e2e

packages:
  - apps/*
  - packages/*
  - tools/*

# Les hooks git sont installés par le script prepare de la racine, pas par le script d'installation de lefthook.
# esbuild et workerd trouvent leur binaire dans leur paquet de plateforme ; leur script d'installation ne fait que le vérifier.
allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false

catalog:
  '@cloudflare/workers-types': 5.20261117.1
  '@eslint/js': 10.0.1
  '@types/node': 24.19.2
  '@vitest/coverage-v8': 5.1.0
  '@vitest/eslint-plugin': 1.6.28
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.15.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-import-x: 4.18.1
  eslint-plugin-simple-import-sort: 14.0.0
  fast-check: 4.10.2
  globals: 17.14.0
  hono: 4.13.19
  lefthook: 2.2.2
  prettier: 3.10.1
  typescript: 6.0.3
  typescript-eslint: 8.73.0
  vitest: 5.1.0
  wrangler: 4.164.0
  zod: 4.6.7
